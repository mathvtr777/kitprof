  <rect x="6" y="6" width="52" height="42" rx="3" fill="#1B2E23"/>
  <!-- chalk strokes standing in for lines of writing -->
  <g stroke="#F6F1E4" stroke-width="3.4" stroke-linecap="round" opacity=".92">
